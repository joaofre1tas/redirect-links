<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
  <p>Redirecionando...</p>
  <script>
    var params = new URLSearchParams(window.location.search);
    var url = params.get('url');
    if (url) {
      setTimeout(function(){ window.location.replace(url); }, 300);
    } else {
      document.querySelector('p').textContent = 'Link inválido';
    }
  </script>
</body>
</html>
